[project]
name = "claude-code-context-llemur"
version = "2.2.0"
description = "Ultimate MARM Implementation - Self-evolving AI development companion with knowledge graphs, pattern recognition, and learning capture"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "context-llemur>=0.2.2",
    "gitpython>=3.1.45",
]

[project.optional-dependencies]
memory = [
    "pyperclip>=1.8.0",
]
intelligence = [
    "pyperclip>=1.8.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "networkx>=3.0",
]

[project.scripts]
ctx-notebook = "src.memory.notebook:cli"
ctx-compile = "src.memory.compiler:cli"
